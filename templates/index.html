<!DOCTYPE html>
<html>
<head>
    <title>Secure File System</title>
</head>

<body>

<h1>🔒 Secure File Encryption System</h1>

<hr>

<h3>1️⃣ Upload & Encrypt File</h3>
<form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required><br><br>
    <input type="password" name="password" placeholder="Set password (if sensitive)">
    <br><br>
    <button type="submit">Encrypt</button>
</form>

<hr>

<h3>2️⃣ View Encrypted Data</h3>
<a href="/view_encrypted">
    <button>View Encrypted 🔒</button>
</a>

<hr>

<h3>3️⃣ Download Encrypted File</h3>
<a href="/download_encrypted">
    <button>Download Files</button>
</a>

<hr>

<h3>4️⃣ Upload Encrypted File + Key</h3>
<form action="/upload_encrypted" method="post" enctype="multipart/form-data">
    <input type="file" name="encfile" required><br><br>
    <input type="file" name="keyfile" required>
    <br><br>
    <button type="submit">Upload</button>
</form>

<hr>

<h3>5️⃣ Decrypt File</h3>
<form action="/decrypt_uploaded" method="post">
    <input type="password" name="password" placeholder="Enter password if required">
    <button type="submit">Decrypt & Download</button>
</form>

</body>
</html>
